<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a two-sided table (rival above, you below) with the play-by-play rail beside it. */
:root {
  --bg: #eceff2;
  --panel: #ffffff;
  --ink: #14181d;
  --muted: #5b6470;
  --line: #d3d9df;
  --accent: #ffd23f;        /* Street Cred and the current step */
  --accent-ink: #6b5200;
  --accent-soft: #fff4c7;
  --c-red: #cf3f37;
  --c-blue: #2c6bd1;
  --c-green: #23905a;
  --c-yellow: #c99700;
  --hatch: #dfe4e9;
  --f-display: "Chakra Petch", "Bahnschrift", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --panel: #171b21; --ink: #e7eaee; --muted: #98a1ac; --line: #2a3139;
    --accent: #ffd23f; --accent-ink: #ffd23f; --accent-soft: #3a3214;
    --c-red: #ef6a61; --c-blue: #6b9cf0; --c-green: #4fc387; --c-yellow: #f0c43a; --hatch: #222830;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #171b21; --ink: #e7eaee; --muted: #98a1ac; --line: #2a3139;
  --accent: #ffd23f; --accent-ink: #ffd23f; --accent-soft: #3a3214;
  --c-red: #ef6a61; --c-blue: #6b9cf0; --c-green: #4fc387; --c-yellow: #f0c43a; --hatch: #222830;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
.app { max-width: 1320px; margin: 0 auto; display: grid; gap: 14px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
h1 { font: 700 22px/1.15 var(--f-display); letter-spacing: .01em; margin: 0; text-wrap: balance; }
.vs { color: var(--muted); font-weight: 500; }
.result { font: 500 13px var(--f-mono); color: var(--muted); }
.controls {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button {
  font: 600 13px var(--f-body); color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; min-width: 40px;
}
button:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible, summary:focus-visible, .line:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #1b1600; }
input[type=range] { flex: 1 1 220px; min-width: 0; accent-color: var(--accent-ink); }
.where { font: 500 13px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.where b { color: var(--ink); font-weight: 600; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 400px); gap: 14px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }
.table { display: grid; gap: 10px; min-width: 0; }
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
.side.active { border-color: var(--accent-ink); box-shadow: inset 0 0 0 1px var(--accent-ink); }
.side-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.who { font: 700 16px var(--f-display); display: flex; align-items: baseline; gap: 8px; }
.who small { font: 500 12px var(--f-body); color: var(--muted); }
.turnflag { font: 600 11px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: #1b1600; background: var(--accent); padding: 2px 6px; border-radius: 3px; }
.cred { display: flex; align-items: baseline; gap: 6px; margin-left: auto; }
.cred .n { font: 700 30px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.cred .l { font: 600 11px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.gigs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.die { display: inline-grid; place-items: center; width: 42px; height: 42px; border-radius: 6px; border: 1.5px solid var(--ink); position: relative; }
.die .v { font: 700 18px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.die .s { position: absolute; top: 2px; left: 4px; font: 500 9px var(--f-mono); color: var(--muted); }
.die.fixer { border-style: dashed; border-color: var(--line); color: var(--muted); width: 34px; height: 34px; }
.die.fixer .v { font: 500 11px var(--f-mono); }
.die.changed { background: var(--accent-soft); }
.label { font: 600 11px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.row { display: grid; gap: 6px; }
.cards { display: flex; flex-wrap: wrap; gap: 8px; }
.card {
  width: 128px; min-height: 84px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px 7px;
  display: grid; grid-template-rows: auto 1fr auto; gap: 3px; background: var(--panel); position: relative;
}
.card .t { font: 600 12px/1.25 var(--f-body); }
.card .sub { font: 400 11px/1.25 var(--f-body); color: var(--muted); }
.card .foot { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.card .pw { font: 700 18px/1 var(--f-display); margin-left: auto; font-variant-numeric: tabular-nums; }
.card .pw.up { color: var(--c-green); }
.card .pw.down { color: var(--c-red); }
.card.spent { transform: rotate(-4deg); opacity: .62; }
.card.down { background: repeating-linear-gradient(135deg, var(--hatch) 0 6px, transparent 6px 12px); }
.card.new { border-color: var(--accent-ink); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot.red { background: var(--c-red); } .dot.blue { background: var(--c-blue); }
.dot.green { background: var(--c-green); } .dot.yellow { background: var(--c-yellow); }
.chip { font: 600 10px var(--f-body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
.gear { font: 500 11px var(--f-body); color: var(--muted); display: flex; gap: 4px; align-items: center; }
.empty { color: var(--muted); font-style: italic; font-size: 12px; }
.areas { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 10px 16px; }
@media (max-width: 700px) { .areas { grid-template-columns: minmax(0, 1fr); } }
.zones { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; }
.zones b { font-variant-numeric: tabular-nums; }
details { font-size: 13px; }
details summary { cursor: pointer; color: var(--muted); }
details ul { margin: 6px 0 0; padding-left: 18px; columns: 2 180px; }
.rail { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-width: 0; max-height: calc(100vh - 120px); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); }
@media (max-width: 900px) { .rail { position: static; max-height: 70vh; } }
.rail h2 { font: 700 14px var(--f-display); margin: 0; padding: 10px 12px 4px; letter-spacing: .02em; }
.now { padding: 4px 12px 10px; border-bottom: 1px solid var(--line); font-size: 13px; display: grid; gap: 2px; }
.log { overflow: auto; padding: 6px 0 12px; font: 12.5px/1.5 var(--f-mono); }
.line { padding: 1px 12px 1px 22px; cursor: pointer; text-indent: -10px; }
.line:hover { background: var(--bg); }
.line.choice { color: var(--ink); font-weight: 500; }
.line.effect { color: var(--muted); }
.line.status { color: var(--muted); font-size: 11.5px; padding-left: 30px; }
.line.turn { font: 700 13px var(--f-display); color: var(--ink); padding-top: 10px; text-indent: 0; padding-left: 12px; }
.line.end, .line.info { color: var(--ink); font-weight: 600; text-indent: 0; padding-left: 12px; }
.line.cur { background: var(--accent-soft); }
.line.future { opacity: .38; }
.banner { font: 700 15px var(--f-display); background: var(--accent); color: #1b1600; border-radius: 6px; padding: 8px 12px; }
@media (max-width: 520px) { .card { width: calc(50% - 4px); } .cred .n { font-size: 24px; } }
@media (prefers-reduced-motion: reduce) { .card.spent { transform: none; } }
</style>

<div class="app">
  <header class="top">
    <h1 id="title"></h1>
    <span class="result" id="result"></span>
  </header>
  <div class="controls" role="toolbar" aria-label="Replay controls">
    <button id="bTurnBack" title="Previous turn (Shift + Left)">« Turn</button>
    <button id="bBack" title="Previous step (Left)">‹ Step</button>
    <button id="bPlay" class="primary" title="Play or pause (Space)">Play</button>
    <button id="bFwd" title="Next step (Right)">Step ›</button>
    <button id="bTurnFwd" title="Next turn (Shift + Right)">Turn »</button>
    <input id="slider" type="range" min="0" value="0" aria-label="Step">
    <span class="where" id="where"></span>
  </div>
  <div class="main">
    <div class="table">
      <section class="side" id="side1"></section>
      <section class="side" id="side0"></section>
      <div id="banner" class="banner" hidden></div>
    </div>
    <aside class="rail">
      <h2>Play-by-play</h2>
      <div class="now" id="now"></div>
      <div class="log" id="log"></div>
    </aside>
  </div>
</div>

<script>
const DATA = /*__DATA__*/null;
const F = DATA.frames, M = DATA.meta;
const P = p => "P" + (p + 1);
let i = 0, timer = null;

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const short = t => t.split(" - ")[0];
const sub = t => t.includes(" - ") ? t.split(" - ").slice(1).join(" - ") : "";

document.getElementById("title").innerHTML =
  `${esc(M.legends[0])} <span class="vs">vs</span> ${esc(M.legends[1])}`;
document.getElementById("result").textContent =
  (M.winner === null ? "unfinished" : M.winner === "draw" ? "Draw" : `${P(M.winner)} wins`) +
  (M.end_reason ? ` · ${M.end_reason}` : "") + ` · ${M.turns} turns · seed ${M.seed}`;

// Log: one element per line, tagged with its frame.
const logEl = document.getElementById("log");
const lineEls = [];
F.forEach((f, fi) => f.lines.forEach(L => {
  if (L.k === "status") return;          // the board already shows this
  const d = document.createElement("div");
  d.className = "line " + L.k;
  d.textContent = L.t;
  d.dataset.f = fi;
  d.tabIndex = -1;
  d.addEventListener("click", () => go(fi));
  logEl.appendChild(d);
  lineEls.push(d);
}));
const turnStarts = F.map((f, fi) => f.lines.some(L => L.k === "turn") ? fi : -1).filter(x => x >= 0);

const slider = document.getElementById("slider");
slider.max = F.length - 1;
slider.addEventListener("input", () => go(+slider.value));

function cardHTML(c, opts = {}) {
  const cls = ["card"];
  if (c.spent) cls.push("spent");
  if (opts.down) cls.push("down");
  if (opts.isNew) cls.push("new");
  const chips = [];
  if (opts.down) chips.push(`<span class="chip">face-down</span>`);
  if (c.known) chips.push(`<span class="chip">known</span>`);
  if (c.spent) chips.push(`<span class="chip">spent</span>`);
  if (c.lag) chips.push(`<span class="chip">lag</span>`);
  if (c.legend) chips.push(`<span class="chip">legend</span>`);
  let pw = "";
  if (c.power !== undefined && !opts.down) {
    const dir = c.base === undefined ? "" : c.power > c.base ? "up" : c.power < c.base ? "down" : "";
    pw = `<span class="pw ${dir}" title="Power">${c.power}</span>`;
  }
  const gears = (c.gears || []).map(g => `<div class="gear"><span class="dot ${g.color}"></span>${esc(short(g.title))}</div>`).join("");
  return `<div class="${cls.join(" ")}" title="${esc(c.title)}">
    <div><div class="t">${esc(short(c.title))}</div><div class="sub">${esc(sub(c.title))}</div></div>
    <div>${gears}</div>
    <div class="foot"><span class="dot ${c.color}"></span>${chips.join("")}${pw}</div>
  </div>`;
}

function sideHTML(p, s, prev, state) {
  const me = s.players[p], was = prev ? prev.players[p] : null;
  const active = s.tp === p && s.turn > 0;
  const prevField = new Set(was ? was.field.map(u => u.uid) : []);
  const prevGigs = was ? was.gigs.map(g => g.join(":")) : [];
  const gigs = me.gigs.map(([sd, v]) => {
    const changed = was && !prevGigs.includes(sd + ":" + v);
    return `<span class="die${changed ? " changed" : ""}" title="d${sd} showing ${v}"><span class="s">d${sd}</span><span class="v">${v}</span></span>`;
  }).join("");
  const fixer = me.fixer.map(sd => `<span class="die fixer" title="d${sd} still in the fixer area"><span class="v">d${sd}</span></span>`).join("");
  const legends = me.legends.map(L => cardHTML(L, {down: !L.face_up})).join("") || `<span class="empty">none left</span>`;
  const field = me.field.map(u => cardHTML(u, {isNew: was && !prevField.has(u.uid)})).join("") || `<span class="empty">no Units</span>`;
  const list = cs => cs.map(c => `<li>${esc(c.title)}</li>`).join("");
  return `
    <div class="side-head">
      <div class="who">${P(p)} <small>${esc(M.names[p])}</small></div>
      ${active ? `<span class="turnflag">Their turn</span>` : ""}
      <div class="cred"><span class="l">Street Cred</span><span class="n">${me.cred === null ? "Null" : me.cred}</span></div>
    </div>
    <div class="row"><span class="label">Gigs ${me.gigs.length}/7</span><div class="gigs">${gigs || `<span class="empty">no Gigs yet</span>`}${fixer}</div></div>
    <div class="areas">
      <div class="row"><span class="label">Field</span><div class="cards">${field}</div></div>
      <div class="row"><span class="label">Legends area</span><div class="cards">${legends}</div></div>
    </div>
    <div class="zones">
      <span>Eddies <b>${me.eddies[0]}</b> ready of <b>${me.eddies[1]}</b></span>
      <span>Deck <b>${me.deck}</b></span>
      <span>Hand <b>${me.hand.length}</b></span>
      <span>Trash <b>${me.trash.length}</b></span>
      ${me.removed.length ? `<span>Removed <b>${me.removed.length}</b></span>` : ""}
    </div>
    <details data-k="hand${p}"><summary>Hand (${me.hand.length})</summary><ul>${list(me.hand) || "<li>empty</li>"}</ul></details>
    <details data-k="trash${p}"><summary>Trash (${me.trash.length})</summary><ul>${list(me.trash) || "<li>empty</li>"}</ul></details>`;
}

function go(n) {
  i = Math.max(0, Math.min(F.length - 1, n));
  const f = F[i], s = f.state, prev = i > 0 ? F[i - 1].state : null;
  for (const p of [0, 1]) {
    const el = document.getElementById("side" + p);
    const open = [...el.querySelectorAll("details[open]")].map(d => d.dataset.k);
    el.innerHTML = sideHTML(p, s, prev);
    el.classList.toggle("active", s.tp === p && s.turn > 0 && s.winner === null);
    open.forEach(k => { const d = el.querySelector(`details[data-k="${k}"]`); if (d) d.open = true; });
  }
  slider.value = i;
  const nx = f.next;
  document.getElementById("where").innerHTML =
    `Turn <b>${s.turn}</b>${s.overtime ? " · overtime" : ""} · step <b>${i}</b>/${F.length - 1}`;
  const now = document.getElementById("now");
  const ch = f.chosen ? `<div><b>${P(f.chosen.player)}</b> chose <b>${esc(f.chosen.kind)}</b>: ${esc(f.chosen.desc)}</div>` : `<div>Game start</div>`;
  const up = nx ? `<div style="color:var(--muted)">Next: ${P(nx.player)} decides <b>${esc(nx.kind)}</b> (${nx.n} options)</div>` : "";
  now.innerHTML = ch + up;
  const b = document.getElementById("banner");
  b.hidden = s.winner === null;
  if (s.winner !== null) b.textContent = (s.winner === "draw" ? "Draw" : `${P(s.winner)} wins`) + (s.end_reason ? `: ${s.end_reason}` : "");
  let first = null;
  for (const el of lineEls) {
    const fi = +el.dataset.f;
    el.classList.toggle("cur", fi === i);
    el.classList.toggle("future", fi > i);
    if (fi === i && !first) first = el;
  }
  if (first) logEl.scrollTop = first.offsetTop - logEl.offsetTop - logEl.clientHeight / 3;
  try { localStorage.setItem("cpbot-replay-step:" + M.seed, i); } catch (e) {}
}

function stepTurn(dir) {
  const t = dir > 0 ? turnStarts.find(x => x > i) : [...turnStarts].reverse().find(x => x < i);
  go(t === undefined ? (dir > 0 ? F.length - 1 : 0) : t);
}
function play() {
  if (timer) { clearInterval(timer); timer = null; bPlay.textContent = "Play"; return; }
  if (i >= F.length - 1) go(0);
  bPlay.textContent = "Pause";
  timer = setInterval(() => { if (i >= F.length - 1) play(); else go(i + 1); }, 700);
}
const bPlay = document.getElementById("bPlay");
bPlay.addEventListener("click", play);
document.getElementById("bBack").addEventListener("click", () => go(i - 1));
document.getElementById("bFwd").addEventListener("click", () => go(i + 1));
document.getElementById("bTurnBack").addEventListener("click", () => stepTurn(-1));
document.getElementById("bTurnFwd").addEventListener("click", () => stepTurn(1));
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
  if (e.key === "ArrowRight") { e.preventDefault(); e.shiftKey ? stepTurn(1) : go(i + 1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); e.shiftKey ? stepTurn(-1) : go(i - 1); }
  else if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); play(); }
});

let start = F.length - 1;
try { const v = localStorage.getItem("cpbot-replay-step:" + M.seed); if (v !== null) start = +v; } catch (e) {}
go(Number.isFinite(start) ? start : 0);
</script>
